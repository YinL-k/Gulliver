# Gulliver's read-only gate: the bypass test set.
#
# Every case is classified by sqlsafety.classify with a fixed test policy:
#   allowed_paths = ["/gulliver-selftest/data"], relative paths resolve there, allow_remote = false,
#   allow_functions = [] (a case can override allow_remote and allow_functions).
# expect is read | write | block; code is the GS code a block must carry ("" = a structural block).
# `gulliver selftest security` runs this file; tests/test_security.py runs it in CI.
# New bypass found? Add it here first (expect = "block"), then fix the gate.

# -- ordinary SQL must stay allowed (false positives are bugs too) --------------------------------
[[case]]
id = "ok-everyday-duckdb"
dialect = "duckdb"
sql = "select date_trunc('day', ts) d, count(*), coalesce(amount, 0), regexp_matches(s, 'x'), regexp_replace(s, 'a', 'b') from events group by 1, 3, 4, 5"
expect = "read"

[[case]]
id = "ok-parquet-glob-in-allowed-folder"
