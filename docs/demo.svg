<svg xmlns="http://www.w3.org/2000/svg" width="1292" height="458" viewBox="0 0 1292 458" role="img">
<rect width="1292" height="458" rx="8" fill="#1e1e1e"/>
<circle cx="20" cy="15" r="6" fill="#ff5f58"/><circle cx="40" cy="15" r="6" fill="#ffbd2e"/><circle cx="60" cy="15" r="6" fill="#18c132"/>
<g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14">
<text x="16.0" y="60.4" fill="#d4d4d4"># a 5-million-row demo table, no warehouse needed</text>
<text x="16.0" y="78.4" fill="#6a9955" font-weight="bold">$</text>
<text x="32.8" y="78.4" fill="#d4d4d4">gulliver demo --events 5000000 &gt; /dev/null &amp;&amp; gulliver --dsn gulliver_demo.duckdb inspect | head -3</text>
<text x="16.0" y="96.4" fill="#d4d4d4">table</text>
<text x="444.4" y="96.4" fill="#d4d4d4">rows</text>
<text x="545.2" y="96.4" fill="#d4d4d4">bytes</text>
<text x="604.0" y="96.4" fill="#d4d4d4">partitioned_by</text>
<text x="16.0" y="114.4" fill="#d4d4d4">events</text>
<text x="419.2" y="114.4" fill="#d4d4d4">5000000</text>
<text x="520.0" y="114.4" fill="#d4d4d4">267.0 MB</text>
<text x="16.0" y="132.4" fill="#d4d4d4">users</text>
<text x="427.6" y="132.4" fill="#d4d4d4">100000</text>
<text x="536.8" y="132.4" fill="#d4d4d4">3.4 MB</text>
<text x="16.0" y="168.4" fill="#d4d4d4"># the classic agent mistake: a self-join on a non-unique key. Rehearse on 1%, 3%, 10% first:</text>
<text x="16.0" y="186.4" fill="#6a9955" font-weight="bold">$</text>
<text x="32.8" y="186.4" fill="#d4d4d4">gulliver rehearse &quot;select a.event_id, b.event_id from events a join events b on a.user_id = b.user_id&quot; | grep -E &#x27;^\| [0-9]|Output rows:|multiplies&#x27;</text>
<text x="16.0" y="204.4" fill="#d4d4d4">| 1% | 0.618s | 2,538,840 | unknown | $0 |</text>
<text x="16.0" y="222.4" fill="#d4d4d4">| 3% | 1.2835s | 7,625,948 | unknown | $0 |</text>
<text x="16.0" y="240.4" fill="#d4d4d4">| 10% | 5.6839s | 25,531,916 | unknown | $0 |</text>
<text x="16.0" y="258.4" fill="#d4d4d4">- Output rows: 256,655,285 (range 179,658,700 - 384,982,928)</text>
<text x="16.0" y="276.4" fill="#d4d4d4">- Warning: the query multiplies rows: about 256,655,285 output rows from at most 5,000,000 input rows per table (51x). Check the join keys: a join on</text>
<text x="16.0" y="294.4" fill="#d4d4d4">a non-unique key matches every pair.</text>
<text x="16.0" y="330.4" fill="#d4d4d4"># a filter that blocks partition pruning, rewritten with the same rows:</text>
<text x="16.0" y="348.4" fill="#6a9955" font-weight="bold">$</text>
<text x="32.8" y="348.4" fill="#d4d4d4">gulliver fix &quot;select event_type, count(*) from events where date(ts) = &#x27;2025-01-20&#x27; group by 1&quot; | head -3</text>
<text x="16.0" y="366.4" fill="#d4d4d4">GV005 [returns exactly the same rows]</text>
<text x="32.8" y="384.4" fill="#d4d4d4">before: CAST(ts AS DATE) = &#x27;2025-01-20&#x27;</text>
<text x="32.8" y="402.4" fill="#d4d4d4">after:</text>
<text x="100.0" y="402.4" fill="#d4d4d4">ts &gt;= &#x27;2025-01-20&#x27; AND ts &lt; &#x27;2025-01-21&#x27;</text>
</g>
</svg>